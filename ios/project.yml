name: YTAudioPlayer
schemes:
  YTAudioPlayer:
    build:
      targets:
        YTAudioPlayer: all
        PeacePlayerWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YTAudioPlayerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  YTAudioPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YTAudioPlayer
      - path: Sources
    resources:
      - path: YTAudioPlayer/LaunchScreen.storyboard
      - path: YTAudioPlayer/Assets.xcassets
      - path: Sources/YTAudioPlayer.xcdatamodeld
    dependencies:
      - target: PeacePlayerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app
        PRODUCT_NAME: PeacePlayer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: YTAudioPlayer/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        UILaunchStoryboardName: LaunchScreen
        CODE_SIGN_ENTITLEMENTS: YTAudioPlayer/YTAudioPlayer.entitlements
    info:
      path: YTAudioPlayer/Info.plist
      properties:
        CFBundleDisplayName: PeacePlayer
        CFBundleName: PeacePlayer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - airplay
        NSMotionUsageDescription: Adaptive Walk DJ detects when you are walking so it can suggest a song at the right moment.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ytaudioplayer.app
            CFBundleURLSchemes:
              - peaceplayer

  PeacePlayerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PeacePlayerWidget
      - path: Sources/SharedNowPlayingState.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app.widget
        PRODUCT_NAME: PeacePlayerWidget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: PeacePlayerWidget/PeacePlayerWidget.entitlements
    info:
      path: PeacePlayerWidget/Info.plist
      properties:
        CFBundleDisplayName: PeacePlayer
        CFBundleName: PeacePlayer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # XCTest target — focused unit tests for the bug-prone pure-Swift
  # logic in Sprint 1+2+3. Tests run in seconds, no device required.
  # See ios/YTAudioPlayerTests/ for the actual test cases.
  YTAudioPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YTAudioPlayerTests
    dependencies:
      - target: YTAudioPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PeacePlayer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PeacePlayer"
