name: YTAudioPlayer
schemes:
  YTAudioPlayer:
    build:
      targets:
        YTAudioPlayer: all
        PeacePlayerWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YTAudioPlayerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
targets:
  YTAudioPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YTAudioPlayer
      - path: Sources
        # S18 / v1.6.6: these four files are orphans from a feature
        # branch ("Add unified sources, chords API, and CoreData",
        # 35ba4c5) that was never fully merged. They reference
        # methods (hasPlexSource, isLiked, insertNext,
        # playbackError, generic, track.downloaded, etc.) that
        # don't exist on the corresponding types — the pre-merge
        # build was working because the pbxproj had these files
        # excluded from the main app target. Excluding them here
        # keeps the build green until the branch is either
        # completed or removed.
        excludes:
          - "UnifiedLibraryViewModel.swift"
          - "UnifiedPlaylist.swift"
          - "UnifiedTrack.swift"
          - "MusicSourceRegistry.swift"
    resources:
      - path: YTAudioPlayer/LaunchScreen.storyboard
      - path: YTAudioPlayer/Assets.xcassets
      - path: Sources/YTAudioPlayer.xcdatamodeld
    dependencies:
      - target: PeacePlayerWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app
        PRODUCT_NAME: PeacePlayer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: YTAudioPlayer/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        UILaunchStoryboardName: LaunchScreen
        CODE_SIGN_ENTITLEMENTS: YTAudioPlayer/YTAudioPlayer.entitlements
    info:
      path: YTAudioPlayer/Info.plist
      properties:
        CFBundleDisplayName: PeacePlayer
        CFBundleName: PeacePlayer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - airplay
        NSMotionUsageDescription: Adaptive Walk DJ detects when you are walking so it can suggest a song at the right moment.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.ytaudioplayer.app
            CFBundleURLSchemes:
              - peaceplayer

  PeacePlayerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PeacePlayerWidget
      - path: Sources/SharedNowPlayingState.swift
      - path: Sources/SharedArtworkCache.swift
      # S18 / v1.6.6: shared cyber color palette so the widget's
      # WidgetTheme can reference the same values as the main
      # app's Theme (CV-6: WidgetTheme is a 4-color fork of the
      # 30-token Theme). This file is the single source of truth
      # for cyberpunk colors + widget-safe text tokens.
      - path: Sources/SharedCyberColors.swift
      # NowPlayingActivityAttributes is consumed by both the
      # widget (for the Live Activity payload) and the main app
      # (LiveActivityManager). Living in PeacePlayerWidget/ used
      # to mean only the widget target compiled it; the main app
      # would see the type as undeclared. Moving the file to
      # Sources/ (via the git mv below) and listing it here
      # makes xcodegen register it in both targets' Sources
      # build phases — one source of truth, both compile cleanly.
      - path: Sources/NowPlayingActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app.widget
        PRODUCT_NAME: PeacePlayerWidget
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: PeacePlayerWidget/PeacePlayerWidget.entitlements
    info:
      path: PeacePlayerWidget/Info.plist
      properties:
        CFBundleDisplayName: PeacePlayer
        CFBundleName: PeacePlayer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # XCTest target — focused unit tests for the bug-prone pure-Swift
  # logic in Sprint 1+2+3. Tests run in seconds, no device required.
  # See ios/YTAudioPlayerTests/ for the actual test cases.
  YTAudioPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YTAudioPlayerTests
    dependencies:
      - target: YTAudioPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ytaudioplayer.app.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4Y85577Z4G
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PeacePlayer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PeacePlayer"
