name: Create source release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Source release for this tag. This does not indicate a production deployment.
            No Docker image or signed iOS build is published by this workflow.
            Validate and deploy the chosen commit separately using the production workflow.
          generate_release_notes: true
